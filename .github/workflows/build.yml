name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: cobbleupgrader
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Publish "latest" release
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cobblemon-1.7') && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            TAG=latest; TITLE="Latest build (Cobblemon 1.8)"; FOR="Cobblemon 1.8+"
          else
            TAG=latest-cobblemon-1.7; TITLE="Latest build (Cobblemon 1.7.3)"; FOR="Cobblemon 1.7.x"
          fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "$JAR" \
            --title "$TITLE" \
            --notes "Built automatically from commit ${GITHUB_SHA::7}. Download the .jar below and put it in your mods folder (Minecraft 1.21.1, Fabric, $FOR)." \
            --target "$GITHUB_SHA"
