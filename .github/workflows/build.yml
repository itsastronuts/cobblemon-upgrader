name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: cobbleupgrader
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$JAR" \
            --title "Latest build" \
            --notes "Built automatically from commit ${GITHUB_SHA::7}. Download the .jar below and put it in your mods folder (Minecraft 1.21.1, Fabric, Cobblemon 1.8+)." \
            --target "$GITHUB_SHA"
